<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — MISChaufen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000510;
      color: #c8d4e8;
      font-family: ui-monospace, 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .wrap { text-align: center; max-width: 30rem; }
    .code {
      font-size: 5rem;
      font-weight: 700;
      color: #4080ff;
      text-shadow: 0 0 30px rgba(64, 128, 255, .4);
      line-height: 1;
      letter-spacing: .1em;
    }
    .msg {
      font-size: .85rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: #6080a0;
      margin: 1rem 0 2rem;
    }
    a {
      color: #00d4ff;
      text-decoration: none;
      font-size: .8rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      border: 1px solid #1a4a8a;
      padding: .5rem 1.25rem;
      transition: color .2s, border-color .2s;
      display: inline-block;
    }
    a:hover { color: #fff; border-color: #00d4ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <p class="msg">Node not found on the grid</p>
    <a href="/">← Return to base</a>
  </div>
</body>
</html>
