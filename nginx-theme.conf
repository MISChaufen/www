# mischaufen.de — JS-free style switching via query param + cookie + sub_filter
# Requires: ngx_http_sub_module (included in most nginx builds)
#
# HOW IT WORKS:
#   ?style=v1  → sets cookie, serves clean stylesheet
#   ?style=v2  → sets cookie, serves warez stylesheet
#   ?style=v3  → sets cookie, serves cyber stylesheet
#   ?style=v4  → sets cookie, serves network stylesheet (default)
#   (no param) → reads cookie to decide; falls back to v4
#
# USAGE: paste the map{} block into your http{} context,
#        paste the rest into your server{} block for mischaufen.de.

# ── http{} context ────────────────────────────────────────────────────────────
map "$arg_style:$cookie_style" $theme_css {
    ~^v1    /style-v1.css;
    ~^:v1$  /style-v1.css;
    ~^v2    /style-v2.css;
    ~^:v2$  /style-v2.css;
    ~^v3    /style-v3.css;
    ~^:v3$  /style-v3.css;
    ~^v4    /style-v4.css;
    ~^:v4$  /style-v4.css;
    ~^v5    /style-v5.css;
    ~^:v5$  /style-v5.css;
    default /style-v4.css;
}

# ── server{} context ──────────────────────────────────────────────────────────
sub_filter_once off;
sub_filter_types text/html;
sub_filter 'style.css' '$theme_css';

location / {
    if ($arg_style = "v1") { add_header Set-Cookie "style=v1; Path=/; SameSite=Lax" always; }
    if ($arg_style = "v2") { add_header Set-Cookie "style=v2; Path=/; SameSite=Lax" always; }
    if ($arg_style = "v3") { add_header Set-Cookie "style=v3; Path=/; SameSite=Lax" always; }
    if ($arg_style = "v4") { add_header Set-Cookie "style=v4; Path=/; SameSite=Lax" always; }
    if ($arg_style = "v5") { add_header Set-Cookie "style=v5; Path=/; SameSite=Lax" always; }
    try_files $uri $uri/ =404;
}
