# mischaufen.de — JS-free style switching via query param + cookie + sub_filter
# Requires: ngx_http_sub_module (included in most nginx builds)
#
# HOW IT WORKS:
#   ?style=v3  → sets cookie, serves cyber stylesheet (default)
#   ?style=v5  → sets cookie, serves tron stylesheet
#   (no param) → reads cookie to decide; falls back to v3
#
# USAGE: paste the map{} block into your http{} context,
#        paste the rest into your server{} block for mischaufen.de.

# ── http{} context ────────────────────────────────────────────────────────────
map "$arg_style:$cookie_style" $theme_css {
    ~^v3    /style-v3.css;
    ~^:v3$  /style-v3.css;
    ~^v5    /style-v5.css;
    ~^:v5$  /style-v5.css;
    default /style-v3.css;
}

# ── server{} context ──────────────────────────────────────────────────────────
sub_filter_once off;
sub_filter_types text/html;
sub_filter 'style.css' '$theme_css';

location / {
    if ($arg_style = "v3") { add_header Set-Cookie "style=v3; Path=/; SameSite=Lax" always; }
    if ($arg_style = "v5") { add_header Set-Cookie "style=v5; Path=/; SameSite=Lax" always; }
    try_files $uri $uri/ =404;
}
