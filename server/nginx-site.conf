# mischaufen.de — full nginx server config for Hetzner deployment
#
# SETUP:
#   1. Place this file in /etc/nginx/sites-available/mischaufen.de
#   2. ln -s /etc/nginx/sites-available/mischaufen.de /etc/nginx/sites-enabled/
#   3. Add the map{} block from nginx-theme.conf into /etc/nginx/nginx.conf http{} context
#   4. Run: certbot --nginx -d mischaufen.de -d www.mischaufen.de
#   5. nginx -t && systemctl reload nginx

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name mischaufen.de www.mischaufen.de;
    return 301 https://mischaufen.de$request_uri;
}

# www → apex redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mischaufen.de;

    ssl_certificate     /etc/letsencrypt/live/mischaufen.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mischaufen.de/privkey.pem;

    return 301 https://mischaufen.de$request_uri;
}

# Main
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mischaufen.de;

    ssl_certificate     /etc/letsencrypt/live/mischaufen.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mischaufen.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /var/www/mischaufen/public;
    index index.html;

    error_page 404 /404.html;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"              always;
    add_header X-Content-Type-Options "nosniff"                 always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # Theme switching sub_filter (map defined in nginx-theme.conf → http{} context)
    sub_filter_once  off;
    sub_filter_types text/html;
    sub_filter 'style.css' '$theme_css';

    # HTML + CSS: revalidate every request (ETags handle 304s, no stale theme)
    location ~* \.(html|css)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Images: long cache (content-addressed via filename)
    location ~* \.(jpg|jpeg|png|webp|ico|gif|svg)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Theme switching cookie + fallback
    location / {
        if ($arg_style = "v3") { add_header Set-Cookie "style=v3; Path=/; SameSite=Lax" always; }
        if ($arg_style = "v5") { add_header Set-Cookie "style=v5; Path=/; SameSite=Lax" always; }
        try_files $uri $uri/ =404;
    }
}
